name: RustPG stable validation
on:
  pull_request:
  push:
    branches: [main, fix/remnants-skill-graph-5-1]
permissions:
  contents: read
concurrency:
  group: rustpg-stable-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable-only source and package
        run: bash scripts/validate.sh
      - name: Test HUD geometry
        run: |
          rustc --edition=2024 --test project/src/rustpg_hud_geometry.rs -o /tmp/rustpg_hud_geometry_tests
          /tmp/rustpg_hud_geometry_tests
      - name: Attach the single Compile-v2 package
        uses: actions/upload-artifact@v4
        with:
          name: RustPG-5.3.0-stable
          path: releases/RustPG.hmod
          retention-days: 7
  native-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Horizon API
        uses: actions/checkout@v4
        with:
          repository: arismoko/horizon
          ref: ff303502a4f7982551a0e0d3622d9268efe9e829
          path: .ci/horizon
          fetch-depth: 1
      - name: Point RustPG at the pinned API checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/Cargo.toml')
          s=p.read_text()
          old='horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }'
          new='horizon-mod-api = { path = "../.ci/horizon/crates/horizon-mod-api" }'
          if old not in s: raise SystemExit('expected Horizon SDK dependency not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Compile stable public-API build
        run: cargo check --manifest-path project/Cargo.toml --lib
      - name: Run Rust unit tests
        run: cargo test --manifest-path project/Cargo.toml --lib -- --test-threads=2
