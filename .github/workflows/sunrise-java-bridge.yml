name: Sunrise Java Rust bridge lab
on:
  push:
    branches: [main]
    paths:
      - 'ports/sunrise-java-bridge/**'
      - '.github/workflows/sunrise-java-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jni-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ports/sunrise-java-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate Java API and fixture JARs
        run: |
          mkdir -p evidence/api evidence/fixture
          javac --release 17 -d evidence/api $(find java/api -name '*.java')
          jar --create --file evidence/bridge-api.jar -C evidence/api .
          javac --release 17 -cp evidence/bridge-api.jar -d evidence/fixture $(find java/fixture -name '*.java')
          jar --create --file evidence/fixture.jar -C evidence/fixture .
      - name: Verify Rust and JNI roundtrip
        run: |
          set -o pipefail
          cargo test 2>&1 | tee evidence/tests.log
          cargo run -- evidence/bridge-api.jar evidence/fixture.jar 2>&1 | tee evidence/roundtrip.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunrise-java-bridge-evidence
          path: ports/sunrise-java-bridge/evidence
