name: Agent terminal bridge

on:
  push:
    branches: ['**']
    paths:
      - ".agent/run.sh"

permissions:
  contents: read

concurrency:
  group: rustpg-agent-terminal
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run requested agent commands
        shell: bash
        run: |
          set -o pipefail
          chmod +x .agent/run.sh
          bash .agent/run.sh 2>&1 | tee /tmp/agent-terminal.log

      - name: Upload terminal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-${{ github.sha }}
          path: /tmp/agent-terminal.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload agent visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-${{ github.sha }}
          path: .agent/artifacts/**
          retention-days: 7
          if-no-files-found: ignore
