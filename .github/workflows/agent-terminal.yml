name: Agent terminal bridge

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - ".agent/run.sh"
      - ".github/workflows/agent-terminal.yml"
      - "project/src/rustpg_ui*.rs"
      - "project/src/rustpg_inspector.rs"
      - "project/src/rustpg_hud*.rs"
      - "project/assets/rustpg/textures/**"
      - "tools/entity_visual_lab/**"
      - "scripts/*visual*.sh"
      - "tools/*visual*.py"

permissions:
  contents: read

concurrency:
  group: rustpg-agent-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore Rust/Horizon build state
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ai-tools/target
            project/target
          key: rustpg-agent-${{ runner.os }}-horizon-ff303502-${{ hashFiles('tools/entity_visual_lab/Cargo.toml', 'project/Cargo.toml') }}
          restore-keys: |
            rustpg-agent-${{ runner.os }}-horizon-ff303502-

      - name: Restore Starling Android game state
        id: starling-cache
        uses: actions/cache/restore@v4
        with:
          path: .agent/starling-cache
          key: starling-android-v090-mc263-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            starling-android-v090-mc263-${{ runner.os }}-

      - name: Run requested agent commands
        shell: bash
        run: |
          set -o pipefail
          chmod +x .agent/run.sh
          bash .agent/run.sh 2>&1 | tee /tmp/agent-terminal.log

      - name: Save Rust/Horizon build state
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ai-tools/target
            project/target
          key: rustpg-agent-${{ runner.os }}-horizon-ff303502-${{ hashFiles('tools/entity_visual_lab/Cargo.toml', 'project/Cargo.toml') }}

      - name: Save Starling Android game state
        if: always() && steps.starling-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .agent/starling-cache
          key: starling-android-v090-mc263-${{ runner.os }}-${{ github.run_id }}

      - name: Upload terminal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-${{ github.sha }}
          path: /tmp/agent-terminal.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload agent visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-${{ github.sha }}
          path: .agent/artifacts/**
          retention-days: 7
          if-no-files-found: ignore
