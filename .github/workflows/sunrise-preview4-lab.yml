name: RustPG Sunrise Preview 4 laboratory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sunrise-preview4-lab.yml'
      - 'tools/preview4_port.py'
      - 'tools/sunrise_compat.py'
      - 'tools/sunrise_rpg_rework.py'
      - 'tools/creature_uv_atlas.py'
      - 'tools/preview4_android_lab.sh'
      - 'tools/sunrise_functional_lab.py'
      - 'tools/creature_inspector.py'
      - 'tools/lab_fixture/**'
  workflow_dispatch:
    inputs:
      native_android:
        description: Build fresh matching SDK APK and run RustPG on Android (expensive)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sunrise-preview4-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  creature_inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'Pillow>=10,<13'
      - run: python3 tools/creature_inspector.py --output .agent/artifacts/creatures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-creature-3d-previews
          path: .agent/artifacts/creatures
  official_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download exact user-supplied APK from official release
        run: |
          curl --fail --location --retry 3 'https://github.com/starling-client/starling/releases/download/preview-2026.11.23.4/starling-preview-x86_64.apk' -o "$RUNNER_TEMP/starling-preview.apk"
          echo "c7cce458826e8a4614f88264f716a9a4469ae98a5e9bd052ae76ede81e425595  $RUNNER_TEMP/starling-preview.apk" | sha256sum -c -
      - name: Test Preview on real Android without RustPG (control calibration)
        run: bash tools/preview4_android_lab.sh "$RUNNER_TEMP/starling-preview.apk" baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-preview4-baseline-not-rustpg
          path: .agent/artifacts/preview4-baseline
  native_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Pin clean Sunrise tree and stage a separate RustPG candidate
        run: |
          mkdir -p "$RUNNER_TEMP/port"
          git clone --filter=blob:none --no-checkout https://github.com/starling-client/starling.git "$RUNNER_TEMP/sunrise"
          git -C "$RUNNER_TEMP/sunrise" fetch --depth=1 origin cac7bf64590fb38b4badee90f1f09848ce7f8daa
          git -C "$RUNNER_TEMP/sunrise" checkout --detach cac7bf64590fb38b4badee90f1f09848ce7f8daa
          test "$(git -C "$RUNNER_TEMP/sunrise" rev-parse HEAD)" = cac7bf64590fb38b4badee90f1f09848ce7f8daa
          python3 -m pip install --break-system-packages numpy Pillow
          python3 tools/preview4_port.py --source "$RUNNER_TEMP/sunrise" --out "$RUNNER_TEMP/port"
      - name: Install pinned toolchain
        working-directory: ${{ runner.temp }}/sunrise
        run: bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target x86_64-linux-android
      - name: Compile and test current RustPG source against Preview API
        run: |
          set -o pipefail
          mkdir -p .agent/artifacts/preview4-port
          cargo check --manifest-path "$RUNNER_TEMP/port/project/Cargo.toml" --lib 2>&1 | tee .agent/artifacts/preview4-port/check.log
          cargo test --manifest-path "$RUNNER_TEMP/port/project/Cargo.toml" --lib -- --test-threads=2 2>&1 | tee .agent/artifacts/preview4-port/tests.log
      - name: Stage and check clean candidate without laboratory commands
        run: |
          set -o pipefail
          python3 tools/preview4_port.py --source "$RUNNER_TEMP/sunrise" --out "$RUNNER_TEMP/port-clean" --release
          CARGO_TARGET_DIR="$RUNNER_TEMP/port/project/target" cargo check --manifest-path "$RUNNER_TEMP/port-clean/project/Cargo.toml" --lib 2>&1 | tee .agent/artifacts/preview4-port/clean-check.log
      - name: Install native SDK Android build dependencies
        if: github.event_name == 'push' || inputs.native_android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build matched Preview SDK APK and RustPG dylib (never use old 0.9.0 library)
        if: github.event_name == 'push' || inputs.native_android
        working-directory: ${{ runner.temp }}/sunrise
        env:
          RUSTFLAGS: -C prefer-dynamic
          SUNRISE_ANDROID_KEY_ALIAS: horizon-debug
        run: |
          set -o pipefail
          python3 tools/android_native_sdk.py prepare
          python3 packaging/android/build_apk.py --abi x86_64 --profile quick --preview
          (cd target/x86_64-linux-android/quick && sha256sum libsunrise_android.so deps/lib*.so) > "$RUNNER_TEMP/game.sha256"
          python3 tools/android_native_sdk.py mods "$RUNNER_TEMP/native-libs" "$RUNNER_TEMP/port/RustPG-preview4-LAB-ONLY.smod" --profile quick --abi x86_64
          (cd target/x86_64-linux-android/quick && sha256sum --quiet -c "$RUNNER_TEMP/game.sha256")
          test -s "$RUNNER_TEMP/native-libs/librustpg.so"
      - name: Test actual RustPG code inside Sunrise Android
        if: github.event_name == 'push' || inputs.native_android
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/sunrise/target/android/starling-*-x86_64.apk)
          test "${#apks[@]}" -eq 1
          bash tools/preview4_android_lab.sh "${apks[0]}" native "$RUNNER_TEMP/native-libs"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RustPG-preview4-validated-candidate
          path: ${{ runner.temp }}/port-clean/RustPG-preview4.smod
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview4-port-and-real-rustpg-runtime
          path: |
            .agent/artifacts/preview4-port
            .agent/artifacts/preview4-native
            ${{ runner.temp }}/port/RustPG-preview4-LAB-ONLY.smod
          if-no-files-found: warn
