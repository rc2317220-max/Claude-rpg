name: Sunrise original Java loaders integration
on:
  push:
    branches: [experimental/sunrise-original-java-loaders]
    paths:
      - '.github/workflows/sunrise-original-java-loaders.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUNRISE_REV: cac7bf64590fb38b4badee90f1f09848ce7f8daa
      BRIDGE_REV: d2af71b731559e195f54626fab5dd56c0accbf04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Transplant original JVM and GPU bridge only
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE/bridge-evidence"
          mkdir -p "$E"
          echo 'BLOCKED: core integration not yet compiled' > "$E/status.txt"
          git clone --no-checkout --filter=blob:none https://github.com/starling-client/starling.git "$RUNNER_TEMP/sunrise"
          cd "$RUNNER_TEMP/sunrise"
          git fetch origin "$SUNRISE_REV"
          git checkout --detach "$SUNRISE_REV"
          git remote add bridge https://github.com/iaxivers/horizon-java-bridge.git
          git fetch --no-tags --filter=blob:none bridge "$BRIDGE_REV"
          printf 'sunrise=%s\nbridge=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse FETCH_HEAD)" > "$E/revisions.txt"
          # Import just the existing JVM crate, including its Java code, real loader
          # bootstraps and GPU backend. Do not merge upstream client/launcher trees.
          test ! -e crates/horizon-jvm
          git archive "$BRIDGE_REV" crates/horizon-jvm | tar -x
          git show "$BRIDGE_REV:LICENSE" > crates/horizon-jvm/LICENSE.upstream
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          anchor = 'members = [\n'
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, anchor + '    "crates/horizon-jvm",\n', 1))
          p = Path('crates/horizon-jvm/Cargo.toml')
          s = p.read_text()
          for old in ('horizon-port-pack', 'horizon-prepare'):
              new = old.replace('horizon-', 'sunrise-')
              assert Path('crates', new, 'Cargo.toml').is_file(), new
              anchor = f'{old} = {{ path = "../{old}" }}'
              assert s.count(anchor) == 1, old
              # Retain the Rust dependency alias; no global class/package rename.
              s = s.replace(anchor, f'{old} = {{ package = "{new}", path = "../{new}" }}')
          p.write_text(s)
          PY
          git diff -- Cargo.toml > "$E/workspace.patch"
          cp crates/horizon-jvm/Cargo.toml "$E/bridge-Cargo.toml"
          cargo metadata --no-deps --format-version 1 > "$E/metadata.json"
          # New workspace member needs lockfile resolution. No --locked on first import.
          cargo check -p horizon-jvm --features prototypes 2>&1 | tee "$E/cargo-check.log"
          echo 'PASS: desktop JVM crate typecheck only; not connected to game or Android' > "$E/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunrise-upstream-bridge-core-evidence
          path: bridge-evidence/
          if-no-files-found: error
