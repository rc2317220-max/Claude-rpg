name: RustPG Asset Studio
on:
  push:
    branches: [main]
    paths:
      - 'tools/asset_studio/**'
      - 'scripts/asset_studio_setup.sh'
      - '.github/workflows/asset-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rustpg-asset-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Blockbench MCP and CPU graphics tools
        run: bash scripts/asset_studio_setup.sh
      - name: Create textured animated model and validate actual RustPG model
        run: bash tools/asset_studio/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustpg-asset-studio-evidence
          path: .ai-tools/asset-studio/smoke/
          include-hidden-files: true
          if-no-files-found: warn
