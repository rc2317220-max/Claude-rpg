name: RustPG Asset Studio
on:
  push:
    branches: [main]
    paths:
      - 'tools/asset_studio/**'
      - 'scripts/asset_studio_setup.sh'
      - '.github/workflows/asset-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rustpg-asset-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Blockbench MCP and CPU graphics tools
        run: bash scripts/asset_studio_setup.sh
      - name: Create textured animated model and validate actual RustPG model
        run: bash tools/asset_studio/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustpg-asset-studio-evidence
          path: .ai-tools/asset-studio/smoke/
          include-hidden-files: true
          if-no-files-found: warn
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install asset tools
        run: bash scripts/asset_studio_setup.sh
      - name: Build original Sentinel through real MCP and render animation
        run: |
          .ai-tools/asset-studio/venv/bin/python tools/asset_studio/ashen_sentinel_v2.py --out .ai-tools/asset-studio/sentinel-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-sentinel-v2-offline-asset
          path: .ai-tools/asset-studio/sentinel-v2/
          include-hidden-files: true
          if-no-files-found: warn
  sentinel_v4:
    needs: [smoke, sentinel]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ashen-sentinel-v2-offline-asset
          path: .ai-tools/asset-studio/baseline
      - name: Install asset tools
        run: bash scripts/asset_studio_setup.sh
      - name: Test IK math and UV regression fixtures
        run: |
          .ai-tools/asset-studio/venv/bin/python tools/asset_studio/motion_lab.py
          .ai-tools/asset-studio/venv/bin/python tools/asset_studio/test_uv.py
      - name: Build V4 using real MCP and extended asset studio
        run: |
          .ai-tools/asset-studio/venv/bin/python tools/asset_studio/ashen_sentinel_v4.py --out .ai-tools/asset-studio/sentinel-v4 --baseline .ai-tools/asset-studio/baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-sentinel-v4-offline-asset
          path: .ai-tools/asset-studio/sentinel-v4/
          include-hidden-files: true
          if-no-files-found: warn
