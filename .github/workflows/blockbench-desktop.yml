name: Blockbench Desktop MCP lab
on:
  push:
    branches: [main]
    paths:
      - 'tools/blockbench_desktop/**'
      - '.agent/blockbench-desktop-commands.json'
      - '.github/workflows/blockbench-desktop.yml'
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Previous successful desktop run ID (optional)'
        required: false
        type: string
      resume_artifact:
        description: 'Artifact name containing checkpoint or model'
        required: false
        type: string
        default: 'blockbench-desktop-evidence'
permissions:
  contents: read
  actions: read
concurrency:
  group: rustpg-blockbench-desktop
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact Blockbench desktop and MCP plugin
        run: bash tools/blockbench_desktop/setup.sh
      - name: Restore previous artifact (manual resume)
        if: ${{ github.event_name == 'push' || inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run || '45402479529' }}
          name: ${{ inputs.resume_artifact || 'blockbench-desktop-evidence' }}
          path: .ai-tools/blockbench-desktop/input
      - name: Execute reviewed MCP requests in actual Electron desktop
        run: bash tools/blockbench_desktop/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockbench-desktop-evidence
          path: .agent/artifacts/blockbench-desktop
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
