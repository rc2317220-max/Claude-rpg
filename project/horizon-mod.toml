id = "claude_rpg"
name = "Rust Pg"
version = "5.1.1-alpha"
description = "Rust Pg 5.1.1 — entidades 3D, AI, partículas, poderes, boss scaling e packs; alpha sem compilação."
authors = ["Rust Pg community"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
# Starling v0.9.0 release commit, source archive recebido no chat.
# Mixins tool do caminho Horizon moderno. As integrações abaixo são presas
# ao Horizon exato desta release e falham o build se o alvo mudar.
horizon = "ff303502a4f7982551a0e0d3622d9268efe9e829"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"


# Player-aware stack limits. Vanilla item max_stack_size stays 64/16; Claude RPG
# applies 16/4 at rank 0 and raises only through the two inventory skill nodes.
[[native.bridge]]
id = "acting_id"
kind = "INVOKE"
target = "horizon_client::game::native_hooks::shared::Game<'_>::native_acting_id"

[[native.mixin]]
id = "stack_inventory_add"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::held_items::Game<'_>::add_stack_to_inventory"
variable = { name = "max", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/stack_inventory_add.rs"
bindings = [
  { name = "value", ty = "u32", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

# Force the shared slot planner to call SlotRules even for vanilla menus; the
# following HEAD mixin then caps shift-click, drag, hotbar and container merges.
[[native.mixin]]
id = "stack_menu_listens"
kind = "RETURN"
target = "horizon_client::game::slot_rules::<Game<'_> as SlotRules>::listens"
helper = "src/mixins/stack_menu_listens.rs"
bindings = [{ name = "_value", ty = "bool", value = "$value" }]

[[native.mixin]]
id = "stack_menu_cap"
kind = "HEAD"
target = "horizon_client::game::slot_rules::<Game<'_> as SlotRules>::rule"
helper = "src/mixins/stack_menu_cap.rs"
bindings = [
  { name = "context", ty = "&SlotContext<'_>", value = "&context" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]


# Tridents bypass the generic bow/crossbow launch hook. Inject after the exact
# successful throw marker, while the locally allocated entity id is still in scope.
[[native.mixin]]
id = "trident_snapshot"
kind = "AFTER_CALL"
target = "horizon_client::game::trident::Game<'_>::release_trident"
selector = "self.player_projectile_shot"
require = 1
ordinal = 0
helper = "src/mixins/trident_snapshot.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "id", ty = "u32", value = "$local:id:0" },
]


# Craft output bonuses need the original vanilla result. The public replace hook
# intentionally does not expose it, so edit the owned result at the central
# native hook boundary before listeners run. One injection covers 2x2, table,
# mod crafting and recipe-book settlement.
[[native.mixin]]
id = "crafting_output"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_prepare_item_craft"
helper = "src/mixins/crafting_output.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "result", ty = "&mut Option<ItemStack>", value = "&mut *result" },
]


# Item attack_range components override entity_interaction_range for several
# weapons. Modify the already-resolved vanilla range itself, using the actual
# held item in the authoritative attack check.
[[native.mixin]]
id = "weapon_reach"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::hand::Game<'_>::within_attack_range"
variable = { name = "reach", ordinal = 0, at = "STORE" }
require = 1
helper = "src/mixins/weapon_reach.rs"
bindings = [
  { name = "value", ty = "mod_api::ItemAttackRange", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]


# Player clone owns the replacement ServerPlayer and can use internal setters
# that are deliberately not exported by this pinned generated ServerHost.
[[native.mixin]]
id = "death_xp_restore"
kind = "RETURN"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_player_clone"
helper = "src/mixins/death_xp_restore.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
]


# Player-specific merchant discount: after vanilla reputation/Hero pricing,
# before the menu opens and before payment matching consumes the offer.
[[native.mixin]]
id = "trade_discount_local"
kind = "AFTER_CALL"
target = "horizon_client::game::trading::Game<'_>::interact_trader"
selector = "session.update_special_prices"
require = 1
ordinal = 0
helper = "src/mixins/trade_discount_local.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "session", ty = "&mut merchant::Session", value = "$local_mut:session:0" },
]

# A LAN guest owns a separate merchant session; apply the same personal price
# immediately before its offers are sent and subsequently used by server clicks.
[[native.mixin]]
id = "trade_discount_guest"
kind = "BEFORE_CALL"
target = "horizon_client::game::network::lan_trading::Game<'_>::lan_open_merchant"
selector = "self.lan_send_offers"
require = 1
ordinal = 0
helper = "src/mixins/trade_discount_guest.rs"
bindings = [
  { name = "uuid", ty = "[i32; 4]", value = "$local:uuid:0" },
  { name = "merchant", ty = "&mut GuestMerchant", value = "$local_mut:gm:0" },
]


# Snapshot the player's fishing wait stat when a real hook id is about to be
# allocated, then scale the exact lure_wait expression for that hook.
[[native.mixin]]
id = "fishing_note_cast"
kind = "HEAD"
target = "horizon_client::game::fishing::Game<'_>::use_fishing_rod"
helper = "src/mixins/fishing_note_cast.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
]

[[native.mixin]]
id = "fishing_wait"
kind = "MODIFY_EXPRESSION_VALUE"
target = "horizon_client::game::fishing::Game<'_>::catching_fish"
selector = "lure_wait(&mut h.random, range, h.lure)"
require = 1
ordinal = 0
helper = "src/mixins/fishing_wait.rs"
bindings = [
  { name = "value", ty = "i32", value = "$value" },
  { name = "hook", ty = "&Hook", value = "&*h" },
]


# Bow: alter the native charge before ArrowLoose, the projectile before spawn,
# and the exact ammo slot consumed after a successful shot.
[[native.mixin]]
id = "bow_draw_speed"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::use_hand::Game<'_>::release_bow"
variable = { name = "charge", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/bow_draw_speed.rs"
bindings = [
  { name = "value", ty = "i32", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "bow_projectile"
kind = "BEFORE_CALL"
target = "horizon_client::game::use_hand::Game<'_>::release_bow"
selector = "self.spawn_projectile"
require = 1
ordinal = 0
helper = "src/mixins/bow_projectile.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "arrow", ty = "&mut Projectile", value = "$local_mut:arrow:0" },
]

[[native.mixin]]
id = "bow_ammo_recovery"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::use_hand::Game<'_>::release_bow"
variable = { name = "arrow_slot", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/bow_ammo_recovery.rs"
bindings = [
  { name = "value", ty = "Option<usize>", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

# Crossbow: charge threshold, loaded projectile count, consumed ammo and the
# final arrow velocity/piercing are all changed at their native consumers.
[[native.mixin]]
id = "crossbow_draw_speed"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::crossbow::Game<'_>::tick_crossbow"
variable = { name = "charge", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/crossbow_draw_speed.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "crossbow_extra_arrows"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::crossbow::Game<'_>::tick_crossbow"
variable = { name = "shots", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/crossbow_extra_arrows.rs"
bindings = [
  { name = "value", ty = "i32", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "crossbow_ammo_recovery"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::crossbow::Game<'_>::tick_crossbow"
variable = { name = "ammo", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/crossbow_ammo_recovery.rs"
bindings = [
  { name = "value", ty = "Ammo", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "crossbow_pierce"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::crossbow::Game<'_>::shoot_crossbow"
variable = { name = "pierce", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "src/mixins/crossbow_pierce.rs"
bindings = [
  { name = "value", ty = "u8", value = "$value" },
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "crossbow_projectile"
kind = "BEFORE_CALL"
target = "horizon_client::game::crossbow::Game<'_>::shoot_crossbow"
selector = "self.spawn_projectile"
require = 1
ordinal = 0
helper = "src/mixins/crossbow_projectile.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "arrow", ty = "&mut Projectile", value = "$local_mut:arrow:0" },
]
